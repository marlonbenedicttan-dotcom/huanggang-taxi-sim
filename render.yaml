# Render blueprint — static site, no server, no cold start.
# Push the repo, then: Render -> New -> Blueprint. Or create a Static Site
# manually with an empty build command and publish directory "web".
#
# NOTE: no custom cache headers. A long max-age hides new deploys (the CDN and
# the browser keep serving the previous build), which is confusing during a
# demo. Render's defaults are fine for a static site.
services:
  - type: web
    name: huanggang-taxi-sim
    runtime: static
    buildCommand: ""
    staticPublishPath: ./web
    autoDeploy: true
    pullRequestPreviewsEnabled: true
