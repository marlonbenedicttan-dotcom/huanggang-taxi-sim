<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Huanggang Port · Taxi Dispatch Simulator</title>
    <meta name="description" content="Interactive 3D simulation of the Huanggang Port taxi queue: change demand, taxi supply, bays and dispatch policy, then watch the queue build." />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b1018'/><rect x='7' y='13' width='18' height='7' rx='2' fill='%23e0564a'/><circle cx='11' cy='22' r='2.2' fill='%23cfd9e8'/><circle cx='21' cy='22' r='2.2' fill='%23cfd9e8'/></svg>" />
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <header class="brand">
          <div class="mark"></div>
          <div>
            <h1>Huanggang Port</h1>
            <p>Taxi dispatch simulator</p>
          </div>
        </header>

        <div class="presets">
          <button data-preset="baseline" class="active">Current process</button>
          <button data-preset="smart">Smart dispatch</button>
        </div>

        <div id="controls" class="controls"></div>

        <div class="runbar">
          <button id="runBtn" class="primary">Run simulation</button>
          <button id="seedBtn" class="ghost" title="New random seed">↻</button>
        </div>
        <p class="hint"><span id="seedOut">1</span> · <span id="hint">ready</span></p>

        <footer>
          Browser port of the Python research model — validated in
          <code>tests/parity_check.py</code>.
        </footer>
      </aside>

      <main>
        <canvas id="scene"></canvas>

        <div id="hud">
          <div id="clock">08:00</div>
          <div id="counts"></div>
        </div>

        <div class="overlay-top">
          <div class="playback">
            <button id="playBtn">Pause</button>
            <select id="windowSel" aria-label="Time window">
              <option value="0">Morning peak 08–11</option>
              <option value="1">Midday 11–14</option>
              <option value="2">Evening peak 16–19</option>
              <option value="3">Whole shift 08–20</option>
            </select>
            <label class="speed">
              <input id="speed" type="range" min="1" max="30" step="1" value="8" />
              <output id="speedOut">8×</output>
            </label>
          </div>
        </div>

        <div id="kpis"></div>
        <div id="chartWrap">
          <div class="chart-head">
            <span>Passengers waiting</span>
            <span class="legend">
              <i style="background:#e0564a"></i>urban
              <i style="background:#3fa86a"></i>NT
              <i style="background:#4a90d9"></i>pre-booked
            </span>
          </div>
          <canvas id="chart"></canvas>
        </div>
      </main>
    </div>

    <script type="module" src="./js/app.js"></script>
    <noscript>This simulator needs JavaScript.</noscript>
  </body>
</html>
