<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#dfe7ee}pre{position:fixed;left:8px;top:8px;background:#fff;font:11px monospace;padding:8px;z-index:5;max-height:90vh;overflow:auto}</style></head>
<body>
<pre id="out">loading…</pre>
<canvas id="c" style="width:1400px;height:700px;display:block"></canvas>
<script type="module">
import * as THREE from "./vendor/three.module.js";
import { GLTFLoader } from "./vendor/GLTFLoader.js";

const canvas = document.getElementById("c");
const r = new THREE.WebGLRenderer({ canvas, antialias: true });
r.setSize(1400, 700, false);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe7ee);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c6c2, 1.6));
const sun = new THREE.DirectionalLight(0xfff4e2, 1.5);
sun.position.set(6, 12, 8);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 20), new THREE.MeshStandardMaterial({ color: 0xb9c6c2 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
scene.add(new THREE.GridHelper(60, 60, 0x8899aa, 0x9fb0ad));

const names = ["taxi", "sedan", "van", "building-a", "building-e", "building-l", "tree_cone", "plant_bush", "detail-awning-wide"];
const loader = new GLTFLoader();
const info = [];
let x = -12;

for (const n of names) {
  await new Promise((res) => loader.load(`./models/${n}.glb`, (g) => {
    const obj = g.scene;
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    info.push(`${n.padEnd(22)} size ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}  center(${center.x.toFixed(2)},${center.y.toFixed(2)},${center.z.toFixed(2)})`);
    obj.position.set(x, -box.min.y, 0);
    scene.add(obj);
    // axis marker: red = +X, blue = +Z
    const ax = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(x, 0.05, 0), 1.4, 0xff0000);
    const az = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(x, 0.05, 0), 1.4, 0x0000ff);
    scene.add(ax, az);
    x += Math.max(size.x, 2.4) + 1.6;
    res();
  }, undefined, (e) => { info.push(`${n} FAILED ${e}`); res(); }));
}

const cam = new THREE.PerspectiveCamera(38, 1400/700, 0.1, 200);
cam.position.set(0, 16, 26);
cam.lookAt(0, 1.5, 0);
r.render(scene, cam);
document.getElementById("out").textContent = info.join("\n");
</script></body></html>
