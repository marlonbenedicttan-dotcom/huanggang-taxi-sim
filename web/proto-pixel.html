<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pixel prototype — Huanggang Port</title>
<style>
  html, body { margin: 0; height: 100%; background: #14100c; display: grid; place-items: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { runSimulation } from "./js/sim.js";

/* ==================================================================
   Pixel-art renderer prototype.

   Everything is drawn into a 384x216 buffer (16:9) and scaled up with
   nearest-neighbour, so the pixels stay square and crisp. Sprites are
   authored as character grids below — that is the whole art pipeline.
   ================================================================== */

const W = 384, H = 216, SCALE = 3;
const canvas = document.getElementById("c");
canvas.width = W * SCALE;
canvas.height = H * SCALE;
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

/* ---------------- palette ---------------- */
const P = {
  sky: "#9ec9d8",
  grassA: "#7fae63", grassB: "#76a55c",
  tarmacA: "#8d8f93", tarmacB: "#85878b",
  kerb: "#e8e2d2",
  wallA: "#efe6d4", wallB: "#d8cdb6",
  roof: "#c2593f", roofDark: "#a14632",
  glass: "#4d6d7a",
  trunk: "#6b4a2f", leaf: "#3f7a44", leafLight: "#4f9152",
  ink: "#241d17",
  white: "#f6f2e8",
  shadow: "rgba(20,16,12,0.28)",
  road: "#5c5f66", roadLine: "#e9e4d4",
};

const CLASS_COLOURS = { urban: "#d1483c", nt: "#2f8f6a", prebook: "#3877b5", flex: "#c98a2e" };

/* ---------------- sprite builder ----------------
   A sprite is rows of characters plus a palette map. '.' is transparent. */
function makeSprite(rows, map) {
  const h = rows.length, w = rows[0].length;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const g = cv.getContext("2d");
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      const col = map[ch];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

/* person 8x12, two walk frames — head, torso, legs */
const PERSON_A = [
  ".hhh.",
  ".sss.",
  ".ccc.",
  "ccccc",
  "ccccc",
  ".ccc.",
  ".l.l.",
  ".s.s.",
];
const PERSON_B = [
  ".hhh.",
  ".sss.",
  ".ccc.",
  "ccccc",
  "ccccc",
  ".ccc.",
  "ll.ll",
  "ss.ss",
];

/* taxi 22x11, side view */
const TAXI = [
  "...ww.....",
  ".tttttt...",
  "tttttttttt",
  "tttttttttt",
  "..d....d..",
  "..dd..dd..",
];

function personSprite(shirt) {
  const map = { h: "#2a2018", s: "#e8b98f", c: shirt, l: "#3b3350", ".": null };
  return [makeSprite(PERSON_A, map), makeSprite(PERSON_B, map)];
}

function taxiSprite(colour) {
  const map = {
    t: colour, w: "#f7f4ea", k: "#f7f4ea", d: "#2b2723", ".": null,
  };
  return makeSprite(TAXI, map);
}

const SPR = {
  person: {
    urban: personSprite(CLASS_COLOURS.urban),
    nt: personSprite(CLASS_COLOURS.nt),
    prebook: personSprite(CLASS_COLOURS.prebook),
    flex: personSprite(CLASS_COLOURS.flex),
  },
  taxi: {
    urban: taxiSprite(CLASS_COLOURS.urban),
    nt: taxiSprite(CLASS_COLOURS.nt),
    prebook: taxiSprite(CLASS_COLOURS.prebook),
    flex: taxiSprite(CLASS_COLOURS.flex),
  },
};

/* ---------------- world → screen ---------------- */
/* ?close renders a zoomed camera — the "HD-2D" framing where sprites have room */
const CLOSE = location.search.includes("close");
const OX = CLOSE ? -196 : 6;
const OY = CLOSE ? 6 : 34;
const SX = CLOSE ? 19.2 : 9.4;
const SZ = CLOSE ? 9.0 : 4.4;
const toPx = (x, z) => [Math.round(OX + x * SX), Math.round(OY + z * SZ)];

/* ---------------- simulation ---------------- */
const cfg = {
  paxPerHour: 550, urbanShare: 0.75, prebookShare: 0.1,
  taxiSupplyRatioUrban: 1.05, taxiSupplyRatioNt: 0.95,
  stands: { urban: 8, nt: 3, prebook: 2 },
  dispatchIntervalMin: 1, dispatchBatch: 8, misrouteProb: 0.06,
  pooledStands: false, appShare: 0, flexShare: 0,
  anim: { from: 30, to: 75, step: 0.08 },
};
const res = runSimulation(cfg, 7);
const frames = res.frames;

/* entity smoothing state */
const taxis = new Map();
const people = new Map();

function laneZ(cls) { return { urban: 4, nt: 12, prebook: 20, flex: 25 }[cls] || 4; }

function bufferPos(cls, i) {
  const y = laneZ(cls);
  const cols = 8;
  return [3 + (i % cols) * 1.15, y - 1.6 + Math.floor(i / cols) * 1.3];
}
function standPos(cls, i) { return [25 + i * 1.2, laneZ(cls)]; }
function bayPos(g, i) { return [36.5, 1.5 + i * 1.45]; }
function queuePos(cls, i) {
  const y = laneZ(cls);
  const cols = 12;
  return [14 + (i % cols) * 0.85, y - 1.2 + Math.floor(i / cols) * 1.1];
}

function sync(frame) {
  const seenT = new Set(), seenP = new Set();

  for (const row of frame.tx) {
    const [id, clsId, state, slot, group, bay] = row;
    seenT.add(id);
    const cls = ["urban", "nt", "prebook", "flex"][clsId] || "urban";
    const pos = state === 2 ? bayPos(group, bay)
      : state === 1 ? standPos(cls, slot)
      : bufferPos(cls, slot);
    let e = taxis.get(id);
    if (!e) { e = { x: -14, z: 25, cls }; taxis.set(id, e); }
    e.tx = pos[0]; e.tz = pos[1]; e.cls = cls;
  }
  for (const [id, clsId, slot] of frame.px) {
    seenP.add(id);
    const cls = ["urban", "nt", "prebook"][clsId] || "urban";
    const p = queuePos(cls, slot);
    let e = people.get(id);
    if (!e) { e = { x: p[0], z: p[1], cls, t: Math.random() * 10 }; people.set(id, e); }
    e.tx = p[0]; e.tz = p[1]; e.cls = cls; e.tx2 = p[0];
  }
  for (const [id] of taxis) if (!seenT.has(id)) { /* keep, will drive off */ }
  for (const [id, e] of people) if (!seenP.has(id)) e.gone = true;
}

/* ---------------- drawing ---------------- */
function dither(x, y, w, h, c1, c2) {
  ctx.fillStyle = c1;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = c2;
  for (let j = 0; j < h; j += 2) {
    for (let i = (j % 4 === 0 ? 0 : 1); i < w; i += 2) ctx.fillRect(x + i, y + j, 1, 1);
  }
}

function drawGround() {
  dither(0, 0, W, H, P.grassA, P.grassB);

  // apron
  const [ax, ay] = toPx(-1, 0.5);
  const [bx, by] = toPx(50, 27);
  dither(ax, ay, bx - ax, by - ay, P.tarmacA, P.tarmacB);

  // lanes
  for (const [cls, z] of [["urban", 4], ["nt", 12], ["prebook", 20]]) {
    const [x0, y0] = toPx(0, z - 2.4);
    const [x1, y1] = toPx(50, z + 2.4);
    ctx.fillStyle = P.kerb;
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.fillStyle = "#8f9195";
    ctx.fillRect(x0, y0 + 2, x1 - x0, y1 - y0 - 4);
    // coloured kerb stripe
    ctx.fillStyle = CLASS_COLOURS[cls];
    ctx.fillRect(x0, y0, x1 - x0, 2);
    ctx.fillRect(x0, y1 - 2, x1 - x0, 2);
  }

  // painted queue bays
  for (const [cls, z] of [["urban", 4], ["nt", 12], ["prebook", 20]]) {
    for (let i = 0; i < 12; i++) {
      const [qx, qy] = toPx(13.6 + i * 0.9, z - 1.4);
      ctx.fillStyle = "rgba(240,238,228,0.5)";
      ctx.fillRect(qx, qy, 1, 3);
      ctx.fillRect(qx, qy + 7, 1, 3);
    }
  }

  // bay pads on the right
  for (let i = 0; i < 11; i++) {
    const [bx, by] = toPx(34.5, 1 + i * 1.9);
    ctx.fillStyle = "rgba(240,238,228,0.55)";
    ctx.fillRect(bx, by, 16, 1);
    ctx.fillRect(bx, by + 6, 16, 1);
  }

  // approach road
  const [rx, ry] = toPx(0, 24);
  const [rx2, ry2] = toPx(50, 29);
  ctx.fillStyle = P.road;
  ctx.fillRect(rx, ry, rx2 - rx, ry2 - ry);
  ctx.fillStyle = P.roadLine;
  for (let x = rx; x < rx2; x += 12) ctx.fillRect(x, ry + ((ry2 - ry) >> 1), 7, 1);
}

function drawTerminal() {
  const [x0, y0] = toPx(-2, -12);
  const [x1, y1] = toPx(48, -3);
  const w = x1 - x0, h = y1 - y0;

  // body
  ctx.fillStyle = P.wallA;
  ctx.fillRect(x0, y0 + 10, w, h - 10);
  ctx.fillStyle = P.wallB;
  ctx.fillRect(x0, y0 + h - 3, w, 3);

  // roof
  ctx.fillStyle = P.roof;
  ctx.fillRect(x0 - 2, y0 + 4, w + 4, 10);
  ctx.fillStyle = P.roofDark;
  ctx.fillRect(x0 - 2, y0 + 12, w + 4, 2);

  // windows
  ctx.fillStyle = P.glass;
  for (let i = 0; i < 16; i++) ctx.fillRect(x0 + 8 + i * 20, y0 + 20, 10, 6);
  for (let i = 0; i < 16; i++) ctx.fillRect(x0 + 8 + i * 20, y0 + 32, 10, 5);

  // entrance
  const ex = x0 + w * 0.42;
  ctx.fillStyle = "#3a4a55";
  ctx.fillRect(ex, y0 + h - 18, 22, 18);
  ctx.fillStyle = "#f3e2b8";
  ctx.fillRect(ex + 2, y0 + h - 16, 18, 4);

  // sign
  ctx.fillStyle = "#f7f3e6";
  ctx.fillRect(ex - 26, y0 + 22, 74, 9);
  ctx.fillStyle = "#2a2118";
  ctx.font = "6px monospace";
  ctx.fillText("HUANGGANG PORT", ex - 24, y0 + 29);
}

function drawTree(x, z) {
  const [px, py] = toPx(x, z);
  ctx.fillStyle = P.shadow;
  ctx.fillRect(px - 3, py - 1, 7, 2);
  ctx.fillStyle = P.trunk;
  ctx.fillRect(px, py - 6, 2, 6);
  ctx.fillStyle = P.leaf;
  ctx.fillRect(px - 4, py - 13, 10, 8);
  ctx.fillStyle = P.leafLight;
  ctx.fillRect(px - 3, py - 12, 5, 3);
}

function drawBench(x, z) {
  const [px, py] = toPx(x, z);
  ctx.fillStyle = "#8a6a45";
  ctx.fillRect(px - 4, py - 3, 9, 2);
  ctx.fillStyle = "#6d5236";
  ctx.fillRect(px - 4, py - 1, 9, 1);
}

function drawEntities(time) {
  const items = [];

  for (const [, e] of taxis) {
    items.push({ kind: "taxi", x: e.x, z: e.z, cls: e.cls });
  }
  for (const [, e] of people) {
    if (e.gone) continue;
    items.push({ kind: "person", x: e.x, z: e.z, cls: e.cls, seed: e.t });
  }

  items.sort((a, b) => (a.z - b.z) || (a.x - b.x));

  for (const it of items) {
    const [px, py] = toPx(it.x, it.z);
    if (it.kind === "taxi") {
      const sp = SPR.taxi[it.cls] || SPR.taxi.urban;
      ctx.fillStyle = P.shadow;
      ctx.fillRect(px - 5, py - 1, 11, 1);
      ctx.drawImage(sp, px - 5, py - 6);
    } else {
      const pair = SPR.person[it.cls] || SPR.person.urban;
      const frame = Math.floor((time * 6 + it.seed) % 2);
      ctx.fillStyle = P.shadow;
      ctx.fillRect(px - 2, py - 1, 5, 1);
      ctx.drawImage(pair[frame], px - 2, py - 8);
    }
  }
}

/* ---------------- loop ---------------- */
let fi = 0, acc = 0;
sync(frames[0]);

const start = performance.now();
function loop(now) {
  acc += (now - start) / 1000;
  const elapsed = Math.max(0, now - start);          // rAF can be earlier than start
  const idx = Math.min(frames.length - 1, Math.floor(elapsed / 260));
  const frame = frames[idx];
  if (!frame) { requestAnimationFrame(loop); return; }

  // smooth toward the frame's targets
  for (const [, e] of taxis) { e.x += (e.tx - e.x) * 0.18; e.z += (e.tz - e.z) * 0.18; }
  for (const [, e] of people) { e.x += (e.tx - e.x) * 0.3; e.z += (e.tz - e.z) * 0.3; }
  sync(frame);

  ctx.clearRect(0, 0, W, H);
  drawGround();
  drawTerminal();
  for (const [x, z] of [[6, -6], [20, -6], [34, -6], [46, -6], [6, 31], [24, 31], [42, 31]]) drawTree(x, z);
  for (const [x, z] of [[6, -1.5], [14, -1.5], [22, -1.5], [30, -1.5], [38, -1.5]]) drawBench(x, z);
  drawEntities(now / 1000);

  ctx.drawImage(canvas, 0, 0, W, H, 0, 0, W * SCALE, H * SCALE);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
